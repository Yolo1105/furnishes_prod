# Local PostgreSQL for development and E2E.
# Start: docker compose up -d
# Stop:  docker compose down

services:
  postgres:
    image: postgres:16
    container_name: furnishes-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: furnishes
      POSTGRES_PASSWORD: furnishes
      POSTGRES_DB: furnishes
    volumes:
      - furnishes_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furnishes -d furnishes"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  furnishes_pg_data:
